        height: auto;
        display: block;
        
      }

      .masonry {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
      }

      .masonry-item {
        
        overflow: hidden;
      }

      .masonry-item img {
        width: 100%;
        height: auto;
        display: block;
      }

      /* Landscape photos span full width */
      .masonry-item[data-landscape] {
        grid-column: 1 / -1;
      }    }

    @media (max-width: 767px) {
      .masonry {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
